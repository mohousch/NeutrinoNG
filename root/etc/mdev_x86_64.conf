# null may already exist; therefore ownership has to be changed with command
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
hwrandom	root:root 444
grsec		root:root 660

kmem		root:root 640
mem		root:root 640
port		root:root 640
# console may already exist; therefore ownership has to be changed with command
console		root:root 600 @chmod 600 $MDEV
ptmx		root:root 666
pty.*		root:root 660

# keep defaults
.*       	root:root 660

# lirc
lirc([0-9])	root:root	0660	>lirc/%1
#lirc.*   	root:root	660 =lirc/

# dri
dri/.*   	root:root 	660
card.*   	root:root 	660 =dri/

# DVB devices
dvb([0-9])\.(.*)([0-9])* root:root	660	>dvb/adapter%1/%2%3

# Typical devices
tty		root:root 666
tty[0-9]*	root:root 660
vcsa*[0-9]*	root:root 660
ttyS[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660

# alsa sound devices
snd/pcm.*	root:root 660
snd/control.*	root:root 660
snd/midi.*	root:root 660
snd/seq		root:root 660
snd/timer	root:root 660

# input stuff
input/event[0-9]+	root:root 640
input/mice		root:root 640
input/mouse[0-9]	root:root 640
input/ts[0-9]		root:root 600

# Mass-storage devices
[hs]d[a-z][0-9]?	root:root	664	*/etc/mdev/mdev-mount.sh

# load modules
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"

