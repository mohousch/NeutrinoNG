SAY Wait for installer mode to start automatically in 5 seconds...
SAY
SAY Options
SAY =======
SAY installer: permanently install NeutrinoNG to HDD/SSD
SAY live: boot NeutrinoNG using RAM for temporary storage
SAY run: boot NeutrinoNG using this USB memory device for storage
SAY
DEFAULT installer
TIMEOUT 50
PROMPT 1

LABEL installer
  KERNEL /KERNEL
  APPEND boot=UUID=0111-2509 installer quiet systemd.debug_shell vga=current

LABEL live
  KERNEL /KERNEL
  APPEND boot=UUID=0111-2509 live quiet vga=current

LABEL run
  KERNEL /KERNEL
  APPEND boot=UUID=0111-2509 disk=UUID=3e14db1d-7ddf-4daa-89fc-67cb055aba57 portable quiet
